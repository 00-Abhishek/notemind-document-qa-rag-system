name: Validate dependencies

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    # The project declares Python 3.12+ in pyproject.toml.  Do not test
    # unsupported Python 3.9--3.11 environments with this requirements file.
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies from wheels
        run: python -m pip install --only-binary=:all: -r requirements.txt
